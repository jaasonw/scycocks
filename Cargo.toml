[package]
name = "scycocks"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Offline Scyrox mouse configurator"

[features]
default = ["gui"]
gui = ["dep:wxdragon"]

[dependencies]
hidapi = "2.6.7"
wxdragon = { version = "0.9.24", default-features = false, optional = true }

[profile.release]
lto = "thin"
strip = true

[lints.clippy]
all = "warn"

[build-dependencies]
embed-manifest = "1.4"
