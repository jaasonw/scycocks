[package]
name = "scycocks"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Offline configurator for gaming mice"

[features]
default = ["gui"]
gui = ["dep:wxdragon"]

[dependencies]
hidapi = "2.6.7"
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
wxdragon = { version = "0.9.24", default-features = false, optional = true }

[profile.release]
lto = "thin"
strip = true

[lints.clippy]
all = "warn"

[build-dependencies]
embed-manifest = "1.4"
